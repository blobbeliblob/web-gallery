<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="gallery-header">
    <h1>Photo Gallery</h1>
    <div class="filter-container">
      <input type="text" id="search-input" placeholder="Search images..." aria-label="Search images">
    </div>
  </header>

  <main id="gallery"></main>

  <div id="lightbox" class="lightbox hidden">
    <span id="lightbox-close" class="lightbox-close" role="button" aria-label="Close lightbox">&times;</span>
    <img id="lightbox-img" class="lightbox-img" alt="" />
    <div id="lightbox-caption" class="lightbox-caption"></div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
